
services:
  db:
    image: mariadb:latest
    restart: always
    container_name: db
    env_file:
      - .env
    environment:
      MARIADB_ROOT_PASSWORD: ${ROOT_PASSWORD}
      MARIADB_DATABASE: db
      MARIADB_USER: ${DB_USER}
      MARIADB_PASSWORD: ${DB_PASSWORD}
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    volumes:
      - mariadb_data:/var/lib/mysql
    ports:
      - "3306:3306"

  web:
    # build: .
    image: gboissel/site-sushi:latest
    container_name: site-sushi
    restart: always
    ports:
      - "8080:5000"
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "./initdb.sh"
    env_file:
      - .env
    environment:
      DB_USER: root
      DB_PASSWORD: ${ROOT_PASSWORD}
      DB_HOST: db
      DB_NAME: db
      DB_PORT: 3306
      MAIL_USERNAME: ${MAIL_USERNAME}
      MAIL_PASSWORD: ${MAIL_PASSWORD}
      MAIL_DEFAULT_SENDER: ${MAIL_DEFAULT_SENDER}
      FLASK_APP: monApp.app:app
      FLASK_ENV: production
    


volumes:
  mariadb_data: