version: '3.8'

services:
  db:
    image: mariadb:latest
    container_name: flask_db
    restart: always
    environment:
      MARIADB_DATABASE: mon_app_db
      MARIADB_USER: user_flask
      MARIADB_PASSWORD: password_secure
      MARIADB_ROOT_PASSWORD: root_password
    volumes:
      - mariadb_data:/var/lib/mysql
    ports:
      - "3306:3306"

  web:
    build: .
    container_name: flask_app
    restart: always
    ports:
      - "8080:5000"
    depends_on:
      - db
    environment:
      - DB_HOST=db
      - DB_NAME=mon_app_db
      - DB_USER=user_flask
      - DB_PASSWORD=password_secure

volumes:
  mariadb_data: